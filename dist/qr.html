<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QR-код · Дмитрий и Алина</title><link rel="stylesheet" href="./assets/fonts.css"><style>*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#f5f2ed;color:#494440;text-align:center;font-family:Manrope,Arial,sans-serif}main{max-width:620px;margin:auto;background:#fffefa;padding:38px 25px}h1{font:500 46px/1.1 'Cormorant Infant',Georgia,serif;margin:0 0 14px}p{font-size:13px;line-height:1.8}img{width:min(100%,320px);height:auto;display:block;margin:22px auto}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}nav a{padding:12px 18px;border:1px solid #72665b;text-decoration:none;color:inherit;font-size:13px}.url{overflow-wrap:anywhere}small{display:block;line-height:1.8;margin:24px 0;font-size:11px}a:focus-visible{outline:2px solid #494440;outline-offset:4px}@media print{body,main{background:#fff}nav,small,.back{display:none}img{width:55mm}}</style></head><body><main><h1>Дмитрий и Алина</h1><p>QR-код на наше свадебное приглашение</p><img src="./qr/invitation.png" alt="QR-код на сайт приглашения" width="1200" height="1200"><p class="url" id="url"></p><nav><a href="./qr/invitation.png" download="alina-dmitry-qr.png">Скачать PNG</a><a href="./qr/invitation.svg" download="alina-dmitry-qr.svg">Скачать SVG</a></nav><small>Для печати используйте SVG или PNG без обрезки белых полей.<br>Перед печатью всего тиража проверьте код камерой телефона.</small><a class="back" href="./">Открыть приглашение ↗</a></main><script>fetch('./qr/url.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const a=document.createElement('a');a.href=data.url;a.textContent=data.url;document.getElementById('url').append(a)}).catch(()=>{document.getElementById('url').textContent='QR-код появится после публикации сайта.'})</script></body></html>
